name: CI

# Runs the tests and builds the OnionOS package on every push to main,
# so a broken build shows up before anything is tagged for release.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Test and build
        run: ./build.sh
      - name: Keep the package for download
        uses: actions/upload-artifact@v4
        with:
          name: mixtape-onionos
          path: dist/*.zip
          retention-days: 14
